<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101113"><title>Nocturne — Todo</title><style>
*{box-sizing:border-box}body{margin:0;background:#101113;color:#eeefed;font:15px system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #d8fa85;outline-offset:4px}.shell{max-width:1160px;margin:auto;padding:38px 48px}.brand{display:flex;align-items:center;gap:12px;font-weight:650;letter-spacing:-.6px}.mark{background:#d8fa85;color:#171a11;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-size:23px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2b2e;padding-bottom:28px}.tag{color:#8a8d92;font-size:12px;letter-spacing:2px}.layout{display:grid;grid-template-columns:1fr 280px;gap:50px;margin-top:64px}.eyebrow{color:#d8fa85;font-size:11px;letter-spacing:2px;font-weight:650}h1{font-size:54px;letter-spacing:-2.5px;line-height:1.08;margin:14px 0 16px;font-weight:550}.sub{color:#8f9297;line-height:1.7;margin-bottom:32px}.entry{background:#1a1c1f;border:1px solid #33363a;padding:9px;border-radius:13px;display:flex;gap:8px}.entry input{min-width:0;flex:1;background:none;border:0;color:#f3f4f1;padding:12px}.add{border:0;border-radius:8px;background:#d8fa85;color:#17200e;font-weight:650;padding:12px 18px}.tabs{display:flex;gap:8px;margin:30px 0 18px}.tabs button{border:0;background:none;color:#8d9197;border-radius:7px;padding:8px 14px}.tabs button.active{background:#292d24;color:#d8fa85}.count{margin-left:auto;color:#71767c;padding:8px;font-size:12px}.task{display:flex;align-items:center;gap:14px;min-height:76px;border-bottom:1px solid #272a2d}.check{appearance:none;flex-shrink:0;width:21px;height:21px;border:1px solid #53595b;border-radius:7px;cursor:pointer;display:grid;place-items:center}.check:checked{background:#d8fa85;border-color:#d8fa85}.check:checked:after{content:'✓';color:#17200e;font-weight:bold}.tasktext{flex:1;overflow-wrap:anywhere;min-width:0}.done .title{color:#767d7c;text-decoration:line-through}.pill{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#aaa6d5;background:#242231;padding:5px 8px;border-radius:5px;margin-top:7px;display:inline-block}.delete{background:none;border:0;color:#757a80;padding:10px;font-size:19px}.delete:hover{color:#ffaaa4}.empty{padding:45px 12px;color:#989e98;text-align:center}.bottom{display:flex;justify-content:space-between;margin-top:22px;font-size:12px;color:#70767b}.clear{border:0;background:none;color:#a5aca1}.aside{padding-top:16px}.graphic{height:270px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#313b23,transparent 65%);display:grid;place-items:center}.orb{width:175px;height:175px;border-radius:50%;background:repeating-radial-gradient(ellipse at 35% 25%,transparent 0 8px,#b3d871 9px 10px,transparent 11px 15px);transform:rotate(-32deg);box-shadow:inset -20px -15px 40px #11160ee0,0 0 50px #9cbf5115}.orbit{position:absolute;width:245px;height:95px;border:1px solid #d8fa8550;border-radius:50%;transform:rotate(-32deg)}.star{position:absolute;right:30px;top:48px;color:#d8fa85;font-size:30px}.card{border:1px solid #30332d;border-radius:14px;padding:24px;background:linear-gradient(135deg,#20251b,#181b18)}.card h2{font-size:15px;font-weight:500;margin:0 0 20px}.stat{font-size:43px;letter-spacing:-2px;color:#d8fa85}.stat small{font-size:17px;letter-spacing:0;color:#7c8674}.bar{height:4px;background:#383e31;border-radius:8px;margin:18px 0}.bar span{display:block;height:100%;background:#d8fa85;border-radius:8px;transition:width .3s}.card p{font-size:12px;color:#9da794;line-height:1.6;margin:0}.quote{margin:28px 10px;font-size:13px;line-height:1.7;color:#798077}footer{margin-top:70px;border-top:1px solid #272a2d;padding-top:20px;color:#5f656b;font-size:11px;display:flex;justify-content:space-between}.category{background:#101113;color:#969e91;border:1px solid #33383a;padding:9px;border-radius:8px;font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr;gap:25px;margin-top:40px}.aside{display:grid;grid-template-columns:140px 1fr;gap:15px}.graphic{height:190px}.orb{width:110px;height:110px}.orbit{width:150px;height:60px}.quote{display:none}.shell{padding:24px}.tag{display:none}h1{font-size:44px}footer{margin-top:40px}}@media(max-width:450px){.entry{flex-wrap:wrap}.entry input{flex-basis:70%}.category{flex:1}.add{flex:1}.aside{grid-template-columns:1fr}.graphic{display:none}.count{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="shell"><header><div class="brand"><span class="mark">↗</span>nocturne<span style="color:#636963;font-weight:400;margin-left:8px">/ todo</span></div><span class="tag">LESS NOISE. MORE FOCUS.</span></header><main class="layout"><section><div class="eyebrow" id="date"></div><h1>Make room for<br>what matters.</h1><p class="sub">A little clarity for your day. One task at a time.</p><form class="entry" id="form"><input id="input" aria-label="New task" placeholder="What needs to get done?" maxlength="240" required autocomplete="off"><select class="category" id="category" aria-label="Task category"><option>Personal</option><option>Work</option></select><button class="add">+ Add task</button></form><nav class="tabs" aria-label="Filter tasks"><button type="button" class="active" data-filter="all" aria-pressed="true">All tasks</button><button type="button" data-filter="active" aria-pressed="false">Active</button><button type="button" data-filter="done" aria-pressed="false">Completed</button><span class="count" id="count"></span></nav><div id="list"></div><div class="bottom"><span id="remaining"></span><button class="clear" id="clear" type="button">Clear completed ↗</button></div><p id="status" aria-live="polite" style="font-size:12px;color:#aab49e;min-height:18px"></p></section><aside class="aside"><div class="graphic" aria-hidden="true"><div class="orb"></div><div class="orbit"></div><span class="star">✦</span></div><div class="card"><h2>Your momentum <span style="float:right;color:#d8fa85">↗</span></h2><div class="stat"><span id="percent">0</span>% <small>complete</small></div><div class="bar"><span id="progress"></span></div><p id="progressText"></p></div><p class="quote">“The secret of getting ahead<br>is getting started.”</p></aside></main><footer><span>A CLEAR MIND STARTS HERE</span><span>Your tasks, saved on this device.</span></footer></div><script>
const key='nocturne-todos-v1';let tasks=[];let filter='all';const $=id=>document.getElementById(id);try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))tasks=saved.filter(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&typeof t.done==='boolean').map(t=>({...t,category:t.category==='Work'?'Work':'Personal'}))}catch{}$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase();function save(){try{localStorage.setItem(key,JSON.stringify(tasks))}catch{$('status').textContent='Storage is unavailable. Keep this tab open to retain your tasks.'}}function render(){const complete=tasks.filter(t=>t.done).length;const active=tasks.length-complete;const visible=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));$('list').replaceChildren();for(const t of visible){const row=document.createElement('div');row.className='task'+(t.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=t.done;check.setAttribute('aria-label','Mark '+t.text+' '+(t.done?'active':'complete'));check.onchange=()=>{t.done=check.checked;save();render()};const content=document.createElement('div');content.className='tasktext';const title=document.createElement('div');title.className='title';title.textContent=t.text;const pill=document.createElement('span');pill.className='pill';pill.textContent=t.category;content.append(title,pill);const del=document.createElement('button');del.className='delete';del.textContent='×';del.setAttribute('aria-label','Delete '+t.text);del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render();$('status').textContent='Task deleted.'};row.append(check,content,del);$('list').append(row)}if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=filter==='done'?'Your completed tasks will appear here.':filter==='active'?'All clear. Enjoy a little breathing room.':'A fresh start. Add your first task above.';$('list').append(empty)}$('count').textContent=tasks.length+' total';$('remaining').textContent=active+' task'+(active===1?'':'s')+' remaining';const percent=tasks.length?Math.round(complete/tasks.length*100):0;$('percent').textContent=percent;$('progress').style.width=percent+'%';$('progressText').textContent=tasks.length?complete+' of '+tasks.length+' tasks complete. '+(active?'Small steps. Steady progress.':'Everything done. Take a breath.'):'Your next small step starts here.';$('clear').hidden=!complete} $('form').onsubmit=e=>{e.preventDefault();const text=$('input').value.trim();if(!text){$('input').value='';$('input').focus();return}tasks.push({id:crypto.randomUUID(),text,category:$('category').value,done:false});$('input').value='';filter='all';setFilter();save();render();$('status').textContent='Task added.';$('input').focus()};function setFilter(){document.querySelectorAll('[data-filter]').forEach(b=>{const selected=b.dataset.filter===filter;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',selected)})}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;setFilter();render()});$('clear').onclick=()=>{tasks=tasks.filter(t=>!t.done);save();render();$('status').textContent='Completed tasks cleared.'};render();
</script></body></html>
