    @keyframes fracture{0%,79%,86%,100%{opacity:0;transform:translate(0,0)}80%,83%{opacity:1;transform:translate(-4px,2px)}81.5%,84.5%{opacity:.7;transform:translate(6px,-2px)}}
    @keyframes displace{0%,79%,86%,100%{transform:translate(0,0)}80%,83%{transform:translate(5px,-2px)}81.5%,84.5%{transform:translate(-5px,2px)}}
    @keyframes scan{0%,79%,86%,100%{opacity:0}80%,83%{opacity:.8}81.5%,84.5%{opacity:.3}}
    @media(prefers-reduced-motion:reduce){.core,.fragments,.scan{animation:none}.fragments,.scan{opacity:0}}
  </style>
